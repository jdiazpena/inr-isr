[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inr-isr-4d"
version = "0.1.0"
description = "Additive 4D ISR neural-field and split-conformal benchmark pipeline"
requires-python = ">=3.11"
dependencies = [
  "h5py>=3.15",
  "numpy>=1.26",
  "torch>=2.11"
]

[project.scripts]
inr-isr-4d = "inr_isr_4d.runner:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
  "amisr_h5_reader_3d",
  "datasets",
  "models",
  "synthetic_analyze_reconstruction",
  "synthetic_analyze_reconstruction_log_errors",
  "synthetic_analyze_reconsturction",
  "synthetic_analyze_reconsturction_linear_errors",
  "synthetic_dataset",
  "synthetic_plasma",
  "synthetic_train_3d",
  "synthetic_train_3d_window_reference_reg",
  "train_radar_3d_window_reference_reg_diagnostic",
  "train_radar_3d_window_reg",
  "training_common",
  "training_config",
  "training_engine",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["inr_isr_4d*", "inr_isr*"]
